<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./images/icon.jpg" type="image/x-icon">

    <title>Form</title>
</head>

<body>

    <!-- ================= SIGN UP ================= -->
    <div id="signUpFormContainer" class="card p-4 shadow-lg rounded-4" style="width: 30rem;">

        <h2 class="text text-center mb-3">
            <img class="logo" src="Images/logo.png" alt="">
            Create Your Account
        </h2>

        <form id="signUpForm">

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="inputFirstName" class="form-label">First name</label>
                    <input required type="text" class="form-control" id="inputFirstName">
                </div>

                <div class="col-md-6">
                    <label for="inputLastName" class="form-label">Last name</label>
                    <input required type="text" class="form-control" id="inputLastName">
                </div>

                <div class="col-md-6">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input required type="email" class="form-control" id="inputEmail">
                </div>

                <div class="col-md-6">
                    <label for="inputPassword4" class="form-label">Password</label>
                    <input required type="password" class="form-control" id="inputPassword">
                </div>

                <div class="col-12">
                    <label for="inputNumber" class="form-label">Phone</label>
                    <input required type="tel" class="form-control" id="inputNumber" placeholder="####-######">
                </div>

                <div class="col-md-6">
                    <label for="inputCity" class="form-label">City</label>
                    <input required type="text" class="form-control" id="inputCity">
                </div>


                <div class="col-12 text-center">
                    <button type="submit" class="btn bg-color text-white w-100 py-2 fw-semibold rounded-3 signUpBtn">
                        Sign Up
                    </button>
                </div>

                <div class="col-12 text-center">
                    <button type="button" class="btn btn-outline-dark w-100 py-2 rounded-3">
                        <img src="./images/google.png" width="30"
                            class="me-2" alt="Google">
                        Sign in with Google
                    </button>
                </div>

                <div class="text-center">
                    <a href="#" id="showLogin">
                        Already have an account? Login
                    </a>
                </div>

            </div>

        </form>
    </div>


    <!-- ================= LOGIN ================= -->
    <div id="loginFormContainer" class="card p-4 shadow-lg rounded-4 d-none" style="width: 30rem;">

        <h2 class="text text-center mb-3">
            <img class="logo" src="Images/logo.png" alt="">
            Login
        </h2>

        <form id="loginForm">

            <div class="row g-3">

                <div class="col-12">
                    <label for="loginName" class="form-label">Full Name</label>
                    <input required type="text" class="form-control" id="loginName">
                </div>

                <div class="col-12">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input required type="email" class="form-control" id="loginEmail">
                </div>

                <div class="col-12">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input required type="password" class="form-control" id="loginPassword">
                </div>


                <div class="col-12 text-center">
                    <button type="submit" class="btn bg-color text-white w-100 py-2 fw-semibold rounded-3" onclick="login()">
                        Login
                    </button>
                </div>

                 <div class="col-12 text-center">
                    <button type="button" class="btn btn-outline-dark w-100 py-2 rounded-3">
                        <img src="./images/google.png" width="30"
                            class="me-2" alt="Google">
                        Sign in with Google
                    </button>
                </div>

                <div class="text-center">
                    <a href="#" id="showSignup">
                        Don't have an account? Sign Up
                    </a>
                </div>

            </div>

        </form>
    </div>


    <!-- Bootstrap -->
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your JavaScript -->
    <script src="./app.js"></script>

</body>

</html>
